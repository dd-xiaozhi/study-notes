server:
  port: 8082

spring:
  application:
    name: mall-order
  # 所有连接信息都可以被环境变量覆盖（12-Factor 配置原则）：
  # 本地开发使用冒号后的默认值；Docker / K8s 中通过环境变量注入
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mall_order}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:mall}
    password: ${DB_PASSWORD:mall123}
  jpa:
    open-in-view: false
    hibernate:
      # 学习项目直接由 Hibernate 建表；生产项目建议使用 Flyway / Liquibase 管理表结构
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mall:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

app:
  version: ${APP_VERSION:local}
