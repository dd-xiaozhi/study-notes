# mall-order · 开发环境（image.tag 由 Jenkins 流水线自动修改，请勿手工改动）
image:
  repository: localhost:5000/mall/mall-order
  tag: "v1"

replicaCount: 1
port: 8082

config:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: mall_order
  DB_USERNAME: mall
  USER_SERVICE_URL: http://mall-user:8081

secretEnv:
  - name: DB_PASSWORD
    secretName: mysql
    secretKey: mysql-password

ingress:
  enabled: true
  host: mall-dev.localhost
  path: /api/orders
